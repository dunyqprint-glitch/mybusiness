<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบวิเคราะห์ยอดขายและกำไรธุรกิจ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen p-4 md:p-8">
  <div class="max-w-6xl mx-auto space-y-6">
    
    <!-- ส่วนหัวและปุ่มจัดการไฟล์ -->
    <header class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
      <div>
        <h1 class="text-2xl font-bold text-slate-900">ระบบสรุปยอดขายและคำนวณกำไร</h1>
        <p class="text-sm text-slate-500 mt-1">อัปโหลดไฟล์ Excel / CSV เพื่อประมวลผลทันที</p>
      </div>
      <div class="flex items-center gap-3">
        <label class="cursor-pointer bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-medium text-sm transition shadow-sm">
          📁 นำเข้า Excel / CSV
          <input type="file" id="fileInput" accept=".xlsx, .csv" class="hidden" onchange="handleFile(event)">
        </label>
        <button onclick="exportData()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg font-medium text-sm transition shadow-sm">
          📥 ส่งออก Excel
        </button>
      </div>
    </header>

    <!-- การ์ดตัวเลขสรุปภาพรวม (KPIs) -->
    <section class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
      <div class="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm">
        <p class="text-xs font-semibold text-slate-400 uppercase">ยอดขายรวม</p>
        <h3 id="totalRevenue" class="text-2xl font-bold text-slate-900 mt-2">฿0</h3>
      </div>
      <div class="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm">
        <p class="text-xs font-semibold text-slate-400 uppercase">ต้นทุนรวม</p>
        <h3 id="totalCost" class="text-2xl font-bold text-rose-500 mt-2">฿0</h3>
      </div>
      <div class="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm">
        <p class="text-xs font-semibold text-slate-400 uppercase">กำไรสุทธิ</p>
        <h3 id="totalProfit" class="text-2xl font-bold text-emerald-600 mt-2">฿0</h3>
      </div>
      <div class="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm">
        <p class="text-xs font-semibold text-slate-400 uppercase">อัตรากำไร (Margin)</p>
        <h3 id="profitMargin" class="text-2xl font-bold text-blue-600 mt-2">0%</h3>
      </div>
    </section>

    <!-- ส่วนกราฟและตารางจัดอันดับ -->
    <section class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <div class="lg:col-span-2 bg-white p-6 rounded-2xl border border-slate-100 shadow-sm">
        <h2 class="font-bold text-slate-800 mb-4">สัดส่วนรายรับและกำไร</h2>
        <canvas id="salesChart" class="max-h-64"></canvas>
      </div>
      <div class="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm">
        <h2 class="font-bold text-slate-800 mb-4">สินค้าทำกำไรสูงสุด</h2>
        <div id="topProductsList" class="space-y-3 text-sm">
          <p class="text-slate-400 text-center py-8">ยังไม่มีข้อมูลรายการสินค้า</p>
        </div>
      </div>
    </section>

  </div>

  <script>
    let salesData = [];
    let chartInstance = null;

    function handleFile(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        const data = new Uint8Array(evt.target.result);
        const workbook = XLSX.read(data, {type: 'array'});
        const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
        salesData = XLSX.utils.sheet_to_json(firstSheet);
        updateDashboard();
      };
      reader.readAsArrayBuffer(file);
    }

    function updateDashboard() {
      let revenue = 0, cost = 0;
      salesData.forEach(row => {
        const qty = Number(row.Quantity || row.จำนวน || 0);
        const price = Number(row.SellingPrice || row.ราคาขาย || 0);
        const unitCost = Number(row.UnitCost || row.ต้นทุน || 0);
        revenue += qty * price;
        cost += qty * unitCost;
      });
      const profit = revenue - cost;
      const margin = revenue > 0 ? ((profit / revenue) * 100).toFixed(1) : 0;

      document.getElementById('totalRevenue').innerText = '฿' + revenue.toLocaleString();
      document.getElementById('totalCost').innerText = '฿' + cost.toLocaleString();
      document.getElementById('totalProfit').innerText = '฿' + profit.toLocaleString();
      document.getElementById('profitMargin').innerText = margin + '%';
    }

    function exportData() {
      if (!salesData.length) return alert('ยังไม่มีข้อมูลสำหรับส่งออก');
      const ws = XLSX.utils.json_to_sheet(salesData);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Sales_Summary");
      XLSX.writeFile(wb, "Sales_Summary.xlsx");
    }
  </script>
</body>
</html>
